<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro Admissions</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-center mb-6">Выберите страну</h1>
        
        <!-- Выпадающий список -->
        <select id="countrySelect" class="w-full p-3 rounded-lg border border-gray-300 mb-6 bg-white shadow-sm focus:ring-2 focus:ring-blue-500">
            <option value="">Выберите страну...</option>
            <option value="Германия">Германия</option>
            <option value="Польша">Польша</option>
            <option value="Чехия">Чехия</option>
            <option value="Италия">Италия</option>
            <option value="Франция">Франция</option>
        </select>

        <div id="serviceList" class="space-y-3">
            <!-- Здесь появятся услуги выбранной страны -->
        </div>

        <div class="mt-8 p-4 bg-white rounded-xl shadow-lg border border-gray-100">
            <h2 class="font-bold text-lg mb-2">🛒 Ваша корзина</h2>
            <div id="cartItems" class="text-gray-600 italic">Пусто</div>
            <button onclick="checkout()" class="w-full mt-4 bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">Оплатить</button>
        </div>
    </div>

    <script>
        const cart = [];
        const countrySelect = document.getElementById('countrySelect');
        const serviceList = document.getElementById('serviceList');

        countrySelect.addEventListener('change', (e) => {
            const country = e.target.value;
            serviceList.innerHTML = country ? `
                <div class="bg-white p-4 rounded-xl shadow border border-gray-100 flex justify-between items-center">
                    <span>Консультация (${country})</span>
                    <button onclick="addToCart('Консультация в ${country}', 50)" class="bg-green-500 text-white px-3 py-1 rounded-lg">+</button>
                </div>
            ` : '';
        });

        function addToCart(item, price) {
            cart.push({item, price});
            document.getElementById('cartItems').innerHTML = cart.map(i => `${i.item} - ${i.price}Это отличная цель! Чтобы сделать современный интерфейс с выпадающими списками, красивыми карточками стран и корзиной, нам нужно обновить твой `index.html`.

Для «супер современного» вида мы будем использовать библиотеку стилей **Tailwind CSS** (она делает всё стильным без лишнего кода) и добавим JavaScript для управления корзиной.

На GitHub в файле `index.html` замени всё на этот код:

).join('<br>');
        }

        function checkout() {
            Telegram.WebApp.showAlert("Переход к оплате: " + cart.length + " услуг");
        }
    </script>
</body>
</html>
