<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0a0a" />
<title>Euro Admissions</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root {
    --bg: #0a0a0a;
    --panel: rgba(10, 10, 10, .82);
    --card: rgba(23, 23, 23, .9);
    --orange: #f97316;
    --orange-soft: rgba(249, 115, 22, .55);
    --orange-bg: rgba(249, 115, 22, .16);
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --safe-top: 0px;
    --safe-bottom: 0px;
    --bar-h: 0px;
    --panel-w: clamp(178px, 42vw, 340px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  /* ---------- карта на фоне ---------- */
  #map { position: fixed; inset: 0; background: var(--bg); z-index: 0; }
  /* делаем светлые линии карты оранжевыми, а фон чёрным */
  .leaflet-tile-pane {
    filter: grayscale(1) sepia(1) hue-rotate(-25deg) saturate(5) brightness(1.7) contrast(1.15);
  }
  .leaflet-container { font-family: inherit; background: var(--bg); }
  .leaflet-control-attribution { background: rgba(10,10,10,.7) !important; color: var(--muted) !important; font-size: 10px; }
  .leaflet-control-attribution a { color: var(--orange-soft) !important; }

  /* затемнение по краям, чтобы карта «тонула» в чёрном */
  .vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 62% 50%, transparent 35%, rgba(10,10,10,.85) 100%); }

  /* ---------- маркеры на карте ---------- */
  .pin span { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: block; }
  .pin .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--bg);
    border: 2px solid var(--orange); box-shadow: 0 0 12px rgba(249,115,22,.7); }
  .pin .badge { display: none; width: 40px; height: 40px; border-radius: 50%; overflow: hidden;
    border: 2px solid var(--orange); background: var(--bg);
    box-shadow: 0 0 0 4px rgba(249,115,22,.25), 0 0 22px rgba(249,115,22,.8); }
  .pin .badge img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pin.on .dot { display: none; }
  .pin.on .badge { display: block; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.4); } to { transform: translate(-50%, -50%) scale(1); } }

  /* ---------- список стран слева ---------- */
  .panel { position: fixed; z-index: 5; left: 12px; width: var(--panel-w);
    top: calc(var(--safe-top) + 12px); bottom: calc(var(--safe-bottom) + var(--bar-h) + 12px);
    display: flex; flex-direction: column;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1.5px solid var(--orange); border-radius: 20px;
    box-shadow: 0 0 28px rgba(249,115,22,.22), inset 0 0 24px rgba(249,115,22,.06);
    transition: bottom .25s ease; }
  .head { padding: 16px 14px 10px; }
  h1 { font-family: Unbounded, Inter, sans-serif; font-weight: 700; font-size: 17px;
    line-height: 1.2; margin: 0 0 6px; letter-spacing: -.01em; }
  .hint { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.4; }

  .list { flex: 1; overflow-y: auto; padding: 4px 10px 12px; display: grid; gap: 8px; align-content: start;
    scrollbar-width: thin; scrollbar-color: var(--orange-soft) transparent; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 10px; border-radius: 14px; font: inherit; color: inherit; cursor: pointer;
    background: var(--card); border: 1px solid var(--orange-soft);
    transition: background .15s, border-color .15s, transform .1s; }
  .row:active { transform: scale(.98); }
  .row.on { background: var(--orange-bg); border-color: var(--orange); box-shadow: 0 0 14px rgba(249,115,22,.3); }
  .flag { flex: none; width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
    border: 1.5px solid var(--orange); background: var(--bg); }
  .flag-fallback { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--orange);
    display: grid; place-items: center; font-size: 20px; }
  .txt { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price { color: var(--orange); font-size: 12.5px; font-weight: 600; margin-top: 1px; }
  .mark { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--orange-soft);
    display: grid; place-items: center; font-size: 13px; font-weight: 700; color: transparent; transition: .15s; }
  .row.on .mark { background: var(--orange); border-color: var(--orange); color: #0a0a0a; }

  /* ---------- корзина внизу ---------- */
  .bar { position: fixed; z-index: 6; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 12px);
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid var(--orange); border-radius: 20px; padding: 12px;
    box-shadow: 0 0 28px rgba(249,115,22,.25);
    transform: translateY(160%); transition: transform .3s cubic-bezier(.2,.9,.3,1); }
  .bar.show { transform: translateY(0); }
  .bar-in { max-width: 560px; margin: 0 auto; }
  .sum { display: flex; align-items: center; gap: 10px; }
  .chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 0; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    border: 1.5px solid var(--orange); background: var(--bg); overflow: hidden; }
  .chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .total { flex: none; text-align: right; }
  .total small { display: block; color: var(--muted); font-size: 12px; }
  .total strong { font-size: 18px; }
  .pay { width: 100%; margin-top: 10px; padding: 14px; border: 1.5px solid var(--orange); border-radius: 14px;
    background: var(--orange); color: #0a0a0a; font: 700 16px Inter, sans-serif; cursor: pointer;
    box-shadow: 0 0 18px rgba(249,115,22,.45); transition: transform .1s, background .15s; }
  .pay:active { transform: scale(.98); background: #ea580c; }

  .toast { position: fixed; z-index: 9; left: 50%; top: calc(var(--safe-top) + 14px);
    transform: translate(-50%, -150%); max-width: 90vw; padding: 10px 16px; border-radius: 14px;
    background: var(--bg); border: 1.5px solid var(--orange); font-size: 13.5px; text-align: center;
    box-shadow: 0 0 20px rgba(249,115,22,.4); transition: transform .3s; }
  .toast.show { transform: translate(-50%, 0); }

  button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div id="map" aria-label="Карта Европы"></div>
<div class="vignette"></div>

<aside class="panel">
  <div class="head">
    <h1>Куда поступаем?</h1>
    <p class="hint">Нажмите на страны, которые рассматриваете. Они попадут в корзину и отметятся на карте.</p>
  </div>
  <div class="list" id="list"></div>
</aside>

<div class="bar" id="bar"><div class="bar-in" id="barIn"></div></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =====================================================================
   КАТАЛОГ СТРАН. Чтобы добавить или изменить страну, правьте только этот список.
   code — двухбуквенный код страны (для флага), price — цена в рублях.
   ===================================================================== */
const COUNTRIES = [
  { id: "germany",     code: "de", name: "Германия",    flag: "🇩🇪", price: 1500, lat: 51.2, lng: 10.4 },
  { id: "france",      code: "fr", name: "Франция",     flag: "🇫🇷", price: 1500, lat: 46.6, lng: 2.4 },
  { id: "italy",       code: "it", name: "Италия",      flag: "🇮🇹", price: 1500, lat: 42.8, lng: 12.5 },
  { id: "spain",       code: "es", name: "Испания",     flag: "🇪🇸", price: 1500, lat: 40.2, lng: -3.7 },
  { id: "netherlands", code: "nl", name: "Нидерланды",  flag: "🇳🇱", price: 1500, lat: 52.2, lng: 5.5 },
  { id: "poland",      code: "pl", name: "Польша",      flag: "🇵🇱", price: 1500, lat: 52.0, lng: 19.4 },
  { id: "czechia",     code: "cz", name: "Чехия",       flag: "🇨🇿", price: 1500, lat: 49.8, lng: 15.5 },
  { id: "austria",     code: "at", name: "Австрия",     flag: "🇦🇹", price: 1500, lat: 47.6, lng: 14.1 },
  { id: "switzerland", code: "ch", name: "Швейцария",   flag: "🇨🇭", price: 1500, lat: 46.8, lng: 8.2 },
  { id: "belgium",     code: "be", name: "Бельгия",     flag: "🇧🇪", price: 1500, lat: 50.6, lng: 4.7 },
  { id: "portugal",    code: "pt", name: "Португалия",  flag: "🇵🇹", price: 1500, lat: 39.6, lng: -8.0 },
  { id: "hungary",     code: "hu", name: "Венгрия",     flag: "🇭🇺", price: 1500, lat: 47.1, lng: 19.5 },
  { id: "finland",     code: "fi", name: "Финляндия",   flag: "🇫🇮", price: 1500, lat: 62.5, lng: 26.0 },
  { id: "sweden",      code: "se", name: "Швеция",      flag: "🇸🇪", price: 1500, lat: 62.0, lng: 15.0 }
];

/* ---------- Telegram (необязательно: сайт работает и без него) ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
function applyInsets() {
  const s = (tg && tg.safeAreaInset) || { top: 0, bottom: 0 };
  const c = (tg && tg.contentSafeAreaInset) || { top: 0, bottom: 0 };
  const r = document.documentElement.style;
  r.setProperty("--safe-top", (s.top + c.top) + "px");
  r.setProperty("--safe-bottom", s.bottom + "px");
}
if (tg && tg.initData) {
  tg.ready();
  tg.expand();
  try { if (tg.isVersionAtLeast("8.0")) tg.requestFullscreen(); } catch (e) {}
  try { tg.setHeaderColor("#0a0a0a"); tg.setBackgroundColor("#0a0a0a"); tg.setBottomBarColor("#0a0a0a"); } catch (e) {}
  try { tg.disableVerticalSwipes(); } catch (e) {}
  applyInsets();
  ["safeAreaChanged", "contentSafeAreaChanged", "fullscreenChanged"].forEach(ev => tg.onEvent(ev, applyInsets));
}
const haptic = (type) => { try { tg.HapticFeedback.impactOccurred(type); } catch (e) {} };

/* ---------- утилиты ---------- */
const $ = id => document.getElementById(id);
const flagUrl = c => `https://flagcdn.com/w80/${c.code}.png`;
const fmt = n => new Intl.NumberFormat("ru-RU").format(n) + " ₽";
const cart = new Set();
const selected = () => COUNTRIES.filter(c => cart.has(c.id));
const plural = n => (n % 10 === 1 && n % 100 !== 11) ? "страна"
  : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? "страны" : "стран";

function flagImg(c, cls) {
  const img = document.createElement("img");
  img.className = cls; img.src = flagUrl(c); img.alt = c.name; img.loading = "lazy";
  img.onerror = () => { // если картинка флага не загрузилась, показываем эмодзи
    const span = document.createElement("span");
    span.className = "flag-fallback"; span.textContent = c.flag;
    img.replaceWith(span);
  };
  return img;
}

let toastTimer;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- карта ---------- */
const isNarrow = () => window.innerWidth < 700;
const map = L.map("map", {
  zoomControl: false, zoomSnap: 0.5, minZoom: 3, maxZoom: 7,
  maxBounds: [[28, -30], [74, 50]], maxBoundsViscosity: 0.8
});
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png", {
  subdomains: "abcd",
  attribution: "&copy; OpenStreetMap &copy; CARTO"
}).addTo(map);

// сдвигаем центр так, чтобы страна оказывалась в видимой части карты справа от списка
function focus(lat, lng, zoom, animate = true) {
  const panelW = document.querySelector(".panel").offsetWidth + 12;
  const p = map.project([lat, lng], zoom).subtract([panelW / 2, 0]);
  const target = map.unproject(p, zoom);
  animate ? map.flyTo(target, zoom, { duration: 0.9 }) : map.setView(target, zoom);
}
focus(53, 14, isNarrow() ? 3 : 4.5, false);

const markers = {};
function pinIcon(c, on) {
  return L.divIcon({
    className: "pin" + (on ? " on" : ""),
    iconSize: [0, 0],
    html: `<span class="dot"></span><span class="badge"><img src="${flagUrl(c)}" alt=""></span>`
  });
}
COUNTRIES.forEach(c => {
  const m = L.marker([c.lat, c.lng], { icon: pinIcon(c, false), keyboard: false }).addTo(map);
  m.on("click", () => toggle(c.id, false));
  markers[c.id] = m;
});

/* ---------- список стран ---------- */
function renderList() {
  const list = $("list"); list.innerHTML = "";
  COUNTRIES.forEach(c => {
    const row = document.createElement("button");
    row.type = "button"; row.dataset.id = c.id;
    row.className = "row" + (cart.has(c.id) ? " on" : "");
    row.appendChild(flagImg(c, "flag"));
    const txt = document.createElement("div"); txt.className = "txt";
    txt.innerHTML = `<div class="name">${c.name}</div><div class="price">${fmt(c.price)}</div>`;
    row.appendChild(txt);
    const mark = document.createElement("span"); mark.className = "mark"; mark.textContent = "✓";
    row.appendChild(mark);
    row.onclick = () => toggle(c.id, true);
    list.appendChild(row);
  });
}

/* ---------- корзина ---------- */
function renderBar() {
  const items = selected();
  const bar = $("bar"), inner = $("barIn");
  if (!items.length) {
    bar.classList.remove("show");
    document.documentElement.style.setProperty("--bar-h", "0px");
    return;
  }
  const total = items.reduce((s, c) => s + c.price, 0);
  inner.innerHTML = `
    <div class="sum">
      <div class="chips" id="chips"></div>
      <div class="total"><small>${items.length} ${plural(items.length)}</small><strong>${fmt(total)}</strong></div>
    </div>
    <button class="pay" id="pay" type="button">Оплатить ${fmt(total)}</button>`;
  const chips = $("chips");
  items.forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.title = "Убрать " + c.name;
    b.appendChild(flagImg(c, ""));
    b.onclick = () => toggle(c.id, false);
    chips.appendChild(b);
  });
  $("pay").onclick = checkout;
  bar.classList.add("show");
  document.documentElement.style.setProperty("--bar-h", (bar.offsetHeight + 12) + "px");
}

function toggle(id, fly) {
  const c = COUNTRIES.find(x => x.id === id);
  const adding = !cart.has(id);
  adding ? cart.add(id) : cart.delete(id);
  haptic("light");
  markers[id].setIcon(pinIcon(c, adding));
  if (adding && fly) focus(c.lat, c.lng, isNarrow() ? 4 : 5);
  const row = document.querySelector(`.row[data-id="${id}"]`);
  if (row) row.classList.toggle("on", adding);
  renderBar();
}

function checkout() {
  const ids = [...cart];
  if (!ids.length) return;
  haptic("medium");
  if (tg && tg.initData) {
    tg.sendData(JSON.stringify({ ids }));   // подключится, когда будет бот
  } else {
    toast("Демо-версия: оплата будет подключена позже");
  }
}

renderList();
renderBar();
window.addEventListener("resize", () => { map.invalidateSize(); renderBar(); });
</script>
</body>
</html>
